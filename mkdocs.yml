site_name: Cosmonautics
site_description: Player and administrator documentation for the Cosmonautics Minecraft space plugin.
site_url: https://kernel-person.github.io/cosmonautics-docs/
repo_url: https://github.com/kernel-person/cosmonautics-docs
repo_name: kernel-person/cosmonautics-docs

theme:
  name: material
  language: en
  logo: images/cosmonautics-icon.png
  favicon: images/cosmonautics-icon.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Player Guide: player-guide.md
  - Commands: commands.md
  - Server Administration:
      - Configuration: configuration.md
      - Permissions: permissions.md
  - Roadmap: roadmap.md

